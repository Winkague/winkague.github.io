  // --- Vue d'ensemble -------------------------------------------------------

  function overview() {
    const ops = new Set(derived.watches.map((w) => w.operatorKey));
    const total = derived.watches.reduce((a, w) => a + w.series.reduce((b, s) => b + s.measurements.length, 0), 0);
    const missing = state.sources.filter((s) => !s.operator).length;
    return h(
      'div',
      { class: 'view' },
      h('div', { class: 'view-head' }, h('h1', {}, t('overview')), h('p', { class: 'muted' }, t('overviewHelp'))),
      missing ? h('div', { class: 'callout warn' }, icon('warn'), h('p', {}, t('missingOperators', { n: missing }))) : null,
      h('div', { class: 'kpis' },
        kpi(t('kpiFiles'), String(state.sources.length)),
        kpi(t('kpiOperators'), String(ops.size)),
        kpi(t('kpiGroups'), String(derived.groups.length)),
        kpi(t('kpiMeasurements'), String(total)),
      ),
      h('div', { class: 'card' }, h('div', { class: 'table-scroll' },
        h('table', { class: 'table' },
          h('thead', {}, h('tr', {},
            h('th', {}, t('group')), h('th', {}, t('movement')), h('th', { class: 'num' }, t('operators')), h('th', { class: 'num' }, t('seriesN')),
            h('th', { class: 'num' }, t('measurements')), h('th', { class: 'num' }, t('weightedRate')), h('th', { class: 'num' }, t('spreadOps')),
            h('th', { class: 'num' }, t('minMax')), h('th', {}, t('alerts')))),
          h('tbody', {}, derived.groups.map((g) => {
            const s = g.stats;
            return h('tr', { class: 'clickable', onclick: () => select(g.key) },
              h('td', { class: 'strong' }, g.label),
              h('td', {}, s.movement ? t('mv_' + s.movement) : '–'),
              h('td', { class: 'num' }, String(s.operators.length)),
              h('td', { class: 'num' }, String(s.seriesCount)),
              h('td', { class: 'num' }, String(s.measurementCount)),
              h('td', { class: 'num rate ' + rateClass(s.weightedRate, s.movement) }, s.weightedRate == null ? t('notEnough') : fmtRate(s.weightedRate) + ' ' + fmtRange(s.weightedUncertainty)),
              h('td', { class: 'num' }, s.stdDevOperators == null ? '–' : fmt(s.stdDevOperators) + ' ' + unit()),
              h('td', { class: 'num' }, s.minRate == null ? '–' : fmtSigned(s.minRate) + ' … ' + fmtSigned(s.maxRate)),
              h('td', {}, alertChips(s)),
            );
          })),
        ),
      )),
    );
  }

  function alertChips(s) {
    const chips = [];
    if (s.outlierCount) chips.push(h('span', { class: 'chip bad' }, t('chipOutliers', { n: s.outlierCount })));
    if (s.unreliableCount) chips.push(h('span', { class: 'chip warn' }, t('chipUnreliable', { n: s.unreliableCount })));
    if (s.ratedCount < s.seriesCount) chips.push(h('span', { class: 'chip' }, t('chipNoRate', { n: s.seriesCount - s.ratedCount })));
    return chips.length ? chips : h('span', { class: 'muted' }, '–');
  }

  function kpi(label, value, sub, cls = '') {
    return h('div', { class: 'kpi ' + cls }, h('div', { class: 'kpi-label' }, label), h('div', { class: 'kpi-value' }, value), sub ? h('div', { class: 'kpi-sub' }, sub) : null);
  }

  // --- Panier -------------------------------------------------------------

    return h(
      'div',
      { class: 'view' },
      h('div', { class: 'view-head' },
        button(t('overview'), () => select(null), { icon: 'back', kind: 'ghost' }),
        h('div', { class: 'title-row' },
          h('h1', {}, g.label),
          button('', () => renameGroup(g), { icon: 'edit', kind: 'ghost icon-only', title: t('renameGroup') }),

        h('p', { class: 'muted' }, t('groupSummary', {

        kpi(t('kpiMean'), fmtRate(s.meanRate), t('medianLabel', { v: fmtRate(s.medianRate) })),
        kpi(t('kpiSpread'), s.stdDevOperators == null ? '–' : fmt(s.stdDevOperators) + ' ' + unit(), s.minRate == null ? '' : t('fromTo', { min: fmtSigned(s.minRate), max: fmtSigned(s.maxRate) })),

  function renameGroup(g) {
    prompt(t('renameGroup'), t('groupName'), g.label, (v) => {
      state.labels[state.groupMode][g.key] = v;
      changed();
    });
  }

  /** « Alice Martin · S2 », et le nom de la montre quand la personne en a
   *  plusieurs dans le panier. */
  function seriesLabel(r) {
    const g = derived.groups.find((x) => x.watches.includes(r.watch));
    const several = g && g.watches.filter((w) => w.operatorKey === r.watch.operatorKey).length > 1;
    return opName(r.watch.operator) + (several ? ' · ' + r.watch.name.trim() : '') + (r.watch.series.length > 1 ? ' · S' + r.series.number : '');
  }

  function rateChartFor(g, goal) {
    const rows = g.stats.rows
      .filter((r) => r.rate && !state.hiddenOps.has(r.watch.operatorKey))
      .sort((a, b) => a.rate.rate - b.rate.rate)
      .map((r) => ({
        label: seriesLabel(r),
        sub: r.watch.name.trim() + ' · ' + t('nMeasurements', { n: r.count }) + ' · ' + fmt(r.rate.spanDays) + ' ' + t('daysShort'),
        rate: r.rate.rate,
        uncertainty: r.rate.uncertainty,
        color: opColor(r.watch.operatorKey),
        outlier: r.outlier,
        tip: seriesLabel(r) + ' : ' + fmtRate(r.rate.rate, 2) + ' ' + fmtRange(r.rate.uncertainty) + (r.outlier ? ' — ' + t('outlierShort') : ''),
      }));
    if (!rows.length) return h('p', { class: 'muted pad' }, t('noRateYet'));
    return h('div', { class: 'chart-wrap' }, C.rateChart(rows, {
      title: t('ratesTitle'),
      goal,
      goalLabel: t('goalLabel', { min: fmtSigned(goal.min), max: fmtSigned(goal.max) }),
      mean: g.stats.weightedRate,
      meanLabel: t('meanMarker', { v: fmtSigned(g.stats.weightedRate) }),
      fmtTick: (v) => (v === 0 ? '0' : fmtSigned(v, Math.abs(v) < 1 ? 1 : 0)),
      axisLabel: t('rateAxis', { unit: unit() }),
    }));
  }

  function deviationChartFor(g) {
    const lines = [];
    for (const r of g.stats.rows) {
      if (state.hiddenOps.has(r.watch.operatorKey)) continue;
      lines.push({
        color: opColor(r.watch.operatorKey),
        dashed: r.series.number > 1,
        points: r.series.measurements.map((m) => ({
          t: m.refUs,
          dev: m.deviation,
          hollow: !m.reliable,
          tip: seriesLabel(r) + ' · ' + fmtDate(m.refUs, m.tzOffsetMin) + ' · ' + fmtSigned(m.deviation, 2) + ' s' + (m.reliable ? '' : ' · ' + t('unreliableShort')) + (m.note ? ' · « ' + m.note + ' »' : ''),
          onClick: () => showMeasurement(m, r.watch, r.series),
        })),
      });
    }
    return h('div', { class: 'chart-wrap' }, C.deviationChart(lines, {
      title: t('deviationTitle'),
      aligned: state.aligned,
      fmtY: (v) => (v === 0 ? '0' : fmtSigned(v, Math.abs(v) < 1 ? 1 : 0)),
      fmtX: (v) => (state.aligned ? fmt(v, Number.isInteger(+v.toFixed(6)) ? 0 : 1) : fmtDate(v, null, false)),
      xLabel: state.aligned ? t('daysAxis') : t('dateAxis'),
      yLabel: state.aligned ? t('deviationSinceStart') : t('deviationAxis'),
    }));
  }

  function legend(g) {
    const ops = g.stats.operators;
    return h('div', { class: 'legend' },
      ops.map((o) => h('button', {
        type: 'button', class: 'legend-item' + (state.hiddenOps.has(o.operatorKey) ? ' off' : ''),
        onclick: () => { state.hiddenOps.has(o.operatorKey) ? state.hiddenOps.delete(o.operatorKey) : state.hiddenOps.add(o.operatorKey); render(); },
        title: t('toggleOperator'),
      }, h('span', { class: 'op-dot', style: 'background:' + opColor(o.operatorKey) }), opName(o.operator))),
      h('span', { class: 'legend-note muted' }, t('legendNote')),
    );
  }

  /** Ce qui ressort du panier : séries à part et leurs raisons probables. */
  function analysis(g) {
    const s = g.stats;
    const items = [];
    const others = (r) => PW.median(s.rows.filter((o) => o !== r && o.rate).map((o) => o.rate.rate));
    for (const r of s.rows.filter((x) => x.outlier)) {
      const ref = others(r);
      items.push(h('li', { class: 'finding bad' },
        h('div', { class: 'finding-title' },
          h('span', { class: 'op-dot', style: 'background:' + opColor(r.watch.operatorKey) }),
          h('strong', {}, seriesLabel(r)),
          ' ' + t('outlierLine', { rate: fmtRate(r.rate.rate), diff: fmtSigned(r.rate.rate - ref) + ' ' + unit(), ref: fmtRate(ref) }),
        ),
        reasons(r, true),
      ));
    }
    if (s.ratedCount >= 2 && !s.outlierCount) {
      items.push(h('li', { class: 'finding good' }, h('div', { class: 'finding-title' }, t('consistent', { sd: fmt(s.stdDevRate) + ' ' + unit() }))));
    }
    const noRate = s.rows.filter((r) => !r.rate);
    if (noRate.length) {
      items.push(h('li', { class: 'finding' }, h('div', { class: 'finding-title' }, t('noRateLine', { who: noRate.map(seriesLabel).join(', ') }))));
    }
    if (!items.length) return null;
    return h('section', { class: 'card analysis' }, h('h2', {}, t('analysisTitle')), h('ul', { class: 'findings' }, items));
  }

  function factorText(f, r) {
    switch (f.code) {
      case 'unreliable': return t('f_unreliable', { n: f.count, total: f.total });
      case 'noRate': return t('f_noRate');
      case 'wideRange': return t('f_wideRange', { v: fmt(f.value) + ' ' + unit() });
      case 'scatter': return t('f_scatter', { v: fmt(f.value) + ' s' });
      case 'few': return t('f_few', { n: f.count });
      case 'short': return t('f_short', { v: fmt(f.value) });
      case 'gap': return t('f_gap', { v: fmt(f.value) });
      case 'tap': return t('f_tap', { n: f.count, total: f.total });
      case 'notes': return t('f_notes', { notes: f.notes.map((n) => '« ' + n + ' »').join(', ') });
      case 'hour': return t('f_hour', { h: fmtHour(f.value), others: fmtHour(f.others) });
      default: return f.code;
    }
  }
  const FACTOR_LEVEL = { unreliable: 'warn', wideRange: 'warn', scatter: 'warn', few: 'warn', short: 'warn', gap: '', tap: '', notes: '', hour: '', noRate: '' };

  function reasons(r, long) {
    const fs = r.factors.filter((f) => f.code !== 'noRate' || !long);
    if (!fs.length) return long ? h('p', { class: 'muted small' }, t('noObviousReason')) : h('span', { class: 'muted' }, '–');
    if (long) return h('ul', { class: 'reasons' }, fs.map((f) => h('li', { class: FACTOR_LEVEL[f.code] }, factorText(f, r))));
    return h('div', { class: 'chips' }, fs.map((f) => h('span', { class: 'chip ' + FACTOR_LEVEL[f.code], title: factorText(f, r) }, t('fc_' + f.code, { n: f.count }))));
  }

  function seriesTable(g) {
    const rows = [...g.stats.rows].sort((a, b) => opName(a.watch.operator).localeCompare(opName(b.watch.operator)) || a.series.number - b.series.number);
    return h('section', { class: 'card' },
      h('div', { class: 'card-head' }, h('h2', {}, t('seriesTitle')), h('p', { class: 'muted' }, t('seriesHelp'))),
      h('div', { class: 'table-scroll' }, h('table', { class: 'table' },
        h('thead', {}, h('tr', {},
          h('th', {}, t('operator')), h('th', {}, t('watch')), h('th', { class: 'num' }, t('seriesShort')), h('th', { class: 'num' }, t('measurements')),
          h('th', {}, t('period')), h('th', { class: 'num' }, t('typicalHour')), h('th', { class: 'num' }, t('rate')), h('th', { class: 'num' }, t('lastDeviation')),
          h('th', { class: 'num' }, t('meanDeviation')), h('th', {}, t('factors')))),
        h('tbody', {}, rows.map((r) => h('tr', { class: r.outlier ? 'row-outlier' : '' },
          h('td', { class: 'nowrap' }, h('span', { class: 'op-dot', style: 'background:' + opColor(r.watch.operatorKey) }), opName(r.watch.operator)),
          h('td', { class: 'nowrap' }, r.watch.name.trim()),
          h('td', { class: 'num' }, String(r.series.number)),
          h('td', { class: 'num' }, String(r.count)),
          h('td', { class: 'nowrap' }, fmtDate(r.from, null, false) + ' – ' + fmtDate(r.to, null, false)),
          h('td', { class: 'num' }, fmtHour(r.typicalHour)),
          h('td', { class: 'num rate ' + rateClass(r.rate?.rate, r.watch.movement || g.stats.movement) }, r.rate ? fmtRate(r.rate.rate, 2) + ' ' + fmtRange(r.rate.uncertainty) : t('notEnough')),
          h('td', { class: 'num' }, fmtSigned(r.lastDeviation, 1) + ' s'),
          h('td', { class: 'num' }, fmtSigned(r.meanDeviation, 1) + ' s'),
          h('td', { class: 'factors' }, h('div', { class: 'chips' }, r.outlier ? h('span', { class: 'chip bad' }, t('outlierShort')) : null, reasons(r, false))),
        ))),
      )),
    );
  }

  function operatorsTable(g) {
    const ops = [...g.stats.operators].sort((a, b) => opName(a.operator).localeCompare(opName(b.operator)));
    return h('section', { class: 'card' },
      h('div', { class: 'card-head' }, h('h2', {}, t('operatorsTitle')), h('p', { class: 'muted' }, t('operatorsHelp'))),
      h('div', { class: 'table-scroll' }, h('table', { class: 'table' },
        h('thead', {}, h('tr', {}, h('th', {}, t('operator')), h('th', { class: 'num' }, t('seriesN')), h('th', { class: 'num' }, t('measurements')), h('th', { class: 'num' }, t('rate')), h('th', { class: 'num' }, t('diffToGroup')))),
        h('tbody', {}, ops.map((o) => h('tr', { class: o.outlier ? 'row-outlier' : '' },
          h('td', { class: 'nowrap' }, h('span', { class: 'op-dot', style: 'background:' + opColor(o.operatorKey) }), opName(o.operator)),
          h('td', { class: 'num' }, String(o.rows.length)),
          h('td', { class: 'num' }, String(o.measurements)),
          h('td', { class: 'num rate ' + rateClass(o.rate, g.stats.movement) }, o.rate == null ? t('notEnough') : fmtRate(o.rate, 2) + ' ' + fmtRange(o.uncertainty)),
          h('td', { class: 'num' }, o.rate == null || g.stats.weightedRate == null ? '–' : fmtSigned(o.rate - g.stats.weightedRate, 2) + ' ' + unit()),
        ))),
      )),
    );
  }

  /** Montres du panier, et déplacement vers un autre panier. */
  function membersCard(g) {
    const mode = state.groupMode;
    const others = derived.groups.filter((x) => x.key !== g.key);
    return h('section', { class: 'card' },
      h('div', { class: 'card-head' }, h('h2', {}, t('membersTitle')), h('p', { class: 'muted' }, t('membersHelp'))),
      h('div', { class: 'table-scroll' }, h('table', { class: 'table' },
        h('thead', {}, h('tr', {}, h('th', {}, t('operator')), h('th', {}, t('nameInFile')), h('th', {}, t('brandModel')), h('th', {}, t('movement')), h('th', { class: 'num' }, t('measurements')), h('th', {}, t('moveTo')))),
        h('tbody', {}, g.watches.map((w) => {
          const overridden = !!state.overrides[mode][w.uid];
          const sel = h('select', { class: 'input small', 'aria-label': t('moveTo'), onchange: (e) => {
            const v = e.target.value;
            if (v === '__new') {
              e.target.value = '';
              prompt(t('newGroup'), t('groupName'), w.name.trim() + ' (' + opName(w.operator) + ')', (name) => {
                const key = 'manual:' + PW.normalize(name);
                state.overrides[mode][w.uid] = key;
                state.labels[mode][key] = name;
                changed();
              });
            } else if (v === '__reset') {
              delete state.overrides[mode][w.uid];
              changed();
            } else if (v) {
              state.overrides[mode][w.uid] = v;
              changed();
            }
          } },
            h('option', { value: '' }, t('keepHere')),
            others.map((o) => h('option', { value: o.key }, o.label)),
            h('option', { value: '__new' }, t('newGroupOption')),
            overridden ? h('option', { value: '__reset' }, t('backToAuto')) : null,
          );
          return h('tr', {},
            h('td', { class: 'nowrap' }, h('span', { class: 'op-dot', style: 'background:' + opColor(w.operatorKey) }), opName(w.operator)),
            h('td', {}, h('code', {}, w.name), overridden ? h('span', { class: 'chip small' }, t('movedByHand')) : null),
            h('td', {}, [w.brand, w.model, w.caliber].filter(Boolean).join(' · ') || '–'),
            h('td', {}, w.movement ? t('mv_' + w.movement) : '–'),
            h('td', { class: 'num' }, String(w.series.reduce((a, s) => a + s.measurements.length, 0))),
            h('td', {}, sel),
          );
        })),
      )),
    );
  }

  function measurementsCard(g) {
    const ops = g.stats.operators;
    const rows = [];
    for (const w of g.watches) {
      if (state.tableOp && w.operatorKey !== state.tableOp) continue;
      for (const s of w.series) {
        s.measurements.forEach((m, i) => rows.push({ w, s, m, prev: s.measurements[i - 1] }));
      }
    }
    rows.sort((a, b) => opName(a.w.operator).localeCompare(opName(b.w.operator)) || a.m.refUs - b.m.refUs);
    return h('section', { class: 'card' },
      h('div', { class: 'card-head' },
        h('h2', {}, t('measurementsTitle')),
        h('select', { class: 'input small', 'aria-label': t('filterOperator'), onchange: (e) => { state.tableOp = e.target.value; render(); } },
          h('option', { value: '' }, t('allOperators')),
          ops.map((o) => h('option', { value: o.operatorKey, selected: state.tableOp === o.operatorKey ? 'selected' : null }, opName(o.operator)))),
      ),
      h('div', { class: 'table-scroll tall' }, h('table', { class: 'table compact' },
        h('thead', {}, h('tr', {},
          h('th', {}, t('operator')), h('th', { class: 'num' }, t('seriesShort')), h('th', {}, t('date')), h('th', {}, t('reading')),
          h('th', { class: 'num' }, t('deviation')), h('th', { class: 'num' }, t('rateSincePrevious')), h('th', {}, t('method')),
          h('th', {}, t('reference')), h('th', {}, t('note')), h('th', {}, ''))),
        h('tbody', {}, rows.map(({ w, s, m, prev }) => {
          const r = prev ? PW.rateBetween(prev, m) : null;
          const hasPhoto = !!(m.photo && state.photos.get(m.sourceId)?.has(m.photo));
          return h('tr', { class: 'clickable' + (m.reliable ? '' : ' row-warn'), onclick: () => showMeasurement(m, w, s) },
            h('td', { class: 'nowrap' }, h('span', { class: 'op-dot', style: 'background:' + opColor(w.operatorKey) }), opName(w.operator)),
            h('td', { class: 'num' }, String(s.number)),
            h('td', { class: 'nowrap' }, fmtDate(m.refUs, m.tzOffsetMin)),
            h('td', { class: 'mono' }, fmtReading(m.reading)),
            h('td', { class: 'num' }, fmtSigned(m.deviation, 2) + ' s'),
            h('td', { class: 'num' }, r == null ? '' : fmtRate(r)),
            h('td', {}, m.method === 'tap' ? t('methodTap') : t('methodPhoto')),
            h('td', {}, m.reliable ? h('span', { class: 'muted' }, t('reliableShort')) : h('span', { class: 'chip warn' }, t('unreliableShort'))),
            h('td', { class: 'note' }, m.note),
            h('td', {}, hasPhoto ? icon('photo', 'muted') : null),
          );
        })),
      )),
    );
  }

  // -------------------------------------------------------------------------
  // Démarrage : glisser-déposer, infobulles, avertissement à la fermeture.

  function setupGlobal() {
    let depth = 0;
    const veil = document.getElementById('drop-veil');
    window.addEventListener('dragenter', (e) => {
      if (![...(e.dataTransfer?.types || [])].includes('Files')) return;
      e.preventDefault();
      depth++;
      veil.classList.add('on');
      veil.querySelector('p').textContent = t('dropHere');
    });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('dragleave', () => {
      depth = Math.max(0, depth - 1);
      if (!depth) veil.classList.remove('on');
    });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      depth = 0;
      veil.classList.remove('on');
      if (e.dataTransfer?.files?.length) importFiles([...e.dataTransfer.files]);
    });
    const tip = document.getElementById('tip');
    document.addEventListener('mousemove', (e) => {
      const el = e.target.closest?.('[data-tip]');
      if (!el) {
        tip.classList.remove('on');
        return;
      }
      tip.textContent = el.getAttribute('data-tip');
      tip.classList.add('on');
      const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
      const y = e.clientY + 18 + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 18;
      tip.style.transform = `translate(${x}px, ${y}px)`;
    });
    window.addEventListener('beforeunload', (e) => {
      if (state.dirty && state.sources.length) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  }

  // Pour les tests automatiques (Playwright) et la console.
  window.PWApp = { state, importFiles, render, derived: () => derived };

  document.addEventListener('DOMContentLoaded', () => {
    setupGlobal();
    derive();
    render();
  });
})();

</script>
</body>
</html>
